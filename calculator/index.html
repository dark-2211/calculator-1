<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Calculator</title>
  <meta name="description" content="A responsive four-function calculator with keyboard support.">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-labelledby="title">
    <header>
      <h1 id="title">Calculator</h1>
      <span class="model" aria-hidden="true">DESK / 01</span>
    </header>
    <section class="screen" aria-label="Calculator display">
      <div id="expression" class="expression" aria-hidden="true"></div>
      <output id="display" aria-label="Current value" aria-live="polite" aria-atomic="true">0</output>
    </section>
    <div class="keypad" role="group" aria-label="Calculator keypad">
      <button class="utility wide" data-key="AC" aria-label="All clear">AC</button>
      <button class="utility" data-key="Backspace" aria-label="Delete last entry">⌫</button>
      <button class="operator" data-key="/" aria-label="Divide">÷</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="operator" data-key="*" aria-label="Multiply">×</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="operator" data-key="-" aria-label="Subtract">−</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button class="operator" data-key="+" aria-label="Add">+</button>
      <button class="wide" data-key="0">0</button>
      <button data-key="." aria-label="Decimal point">.</button>
      <button class="equals" data-key="=" aria-label="Equals">=</button>
    </div>
    <footer aria-label="Keyboard shortcuts">
      <span><kbd>Enter</kbd> Equals</span>
      <span><kbd>Backspace</kbd> Delete</span>
      <span><kbd>Esc</kbd> Clear</span>
    </footer>
  </main>
</body>
</html>
